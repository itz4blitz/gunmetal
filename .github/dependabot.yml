# Grouped weekly version updates with a seven-day cooldown (SEC-SUP-028).
# The cooldown applies to version updates only, so security updates are not
# delayed. The npm entry covers the client workspace under /clients. Add the
# docker ecosystem with the first Dockerfile.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /clients
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
