name: CodeQL

# CodeQL for GitHub Actions and Rust on every pull request, every push to
# main, and weekly (SEC-SUP-014, SEC-SUP-018). JavaScript joins the matrix
# when the tree has any, because CodeQL fails a language with no source.
# While the repository is private the SARIF is not uploaded to code
# scanning (`upload: never`). `xtask repo codeql` fails the job on any
# result at error level or security severity 7.0 or more, the SARIF is kept
# as a workflow artifact, and the `codeql` job gives the ruleset one stable
# check to require whatever languages the matrix holds.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

# Nothing by default; each job asks for what it needs (SEC-SUP-012).
permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  languages:
    name: languages
    runs-on: [self-hosted, gunmetal-mutants]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        run: |
          set -eu
          # The Rust extractor rejects autobuild; none is the supported
          # buildless mode (SEC-SUP-018).
          rust='{"language":"rust","build-mode":"none"}'
          actions='{"language":"actions","build-mode":"none"}'
          if git ls-files -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' 'package.json' | grep -q .; then
            javascript='{"language":"javascript-typescript","build-mode":"none"}'
            echo "matrix={\"include\":[${actions},${javascript},${rust}]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[${actions},${rust}]}" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: analyze (${{ matrix.language }})
    needs: languages
    runs-on: [self-hosted, gunmetal-mutants]
    timeout-minutes: 60
    # Read-only scopes; nothing is uploaded (upload: never), so the job
    # never writes (SEC-SUP-012).
    permissions:
      contents: read # check out the tree to analyse
      actions: read # fingerprinting the local SARIF reads this workflow run
      security-events: read # CodeQL reads its feature flags from code scanning
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every language needs Rust: the Rust extractor, and the xtask check
      # that reads the SARIF.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      # Caching is for this CI only; release workflows must not restore or save
      # caches (SEC-SUP-015).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: codeql-xtask
          add-job-id-key: false
          cache-workspace-crates: true
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The substring-sanitization rule misreads test assertions of
          # absence as sanitization: a test that expects no `http` in a
          # source file is checking a string, not guarding a URL. The rule
          # is excluded for test files only; every other rule, and this
          # rule everywhere else, still reads them.
          config: |
            query-filters:
            - exclude:
                queries:
                  - js/incomplete-url-substring-sanitization
                paths:
                  - .*\.test\.(ts|tsx)$
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          output: codeql-results
          upload: never
          upload-database: false
      # `analyze` does not fail the job on findings when upload is `never`,
      # so xtask reads every SARIF log it wrote (SEC-SUP-018).
      - name: Fail on high-severity or error-level results
        run: |
          set -eu
          found=0
          for sarif in codeql-results/*.sarif; do
            [ -f "$sarif" ] || continue
            found=1
            cargo run --locked --quiet -p xtask -- repo codeql "$sarif"
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::CodeQL wrote no SARIF log"
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: warn
          retention-days: 30

  codeql:
    name: codeql
    needs: analyze
    if: always()
    runs-on: [self-hosted, gunmetal-mutants]
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every language passed
        env:
          RESULT: ${{ needs.analyze.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::CodeQL analysis result: $RESULT"
            exit 1
          fi
