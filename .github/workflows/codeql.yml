name: CodeQL

# CodeQL for GitHub Actions and Rust on every pull request, every push to
# main, and weekly (SEC-SUP-014, SEC-SUP-018). JavaScript joins the matrix
# when the tree has any, because CodeQL fails a language with no source.
# While the repository is private the SARIF is not uploaded to code
# scanning (`upload: never`). `xtask repo codeql` fails the job on any
# result at error level or security severity 7.0 or more, the SARIF is kept
# as a workflow artifact, and the `codeql` job gives the ruleset one stable
# check to require whatever languages the matrix holds.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

# Nothing by default; each job asks for what it needs (SEC-SUP-012).
# Forgejo ignores this field and warns. It stays: zizmor requires it
# (record 23).
permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  languages:
    name: languages
    runs-on: [self-hosted, gunmetal-mutants]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        run: |
          set -eu
          # The Rust extractor rejects autobuild; none is the supported
          # buildless mode (SEC-SUP-018).
          rust='{"language":"rust","build-mode":"none"}'
          actions='{"language":"actions","build-mode":"none"}'
          if git ls-files -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' 'package.json' | grep -q .; then
            javascript='{"language":"javascript-typescript","build-mode":"none"}'
            echo "matrix={\"include\":[${actions},${javascript},${rust}]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[${actions},${rust}]}" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: analyze (${{ matrix.language }})
    needs: languages
    runs-on: [self-hosted, gunmetal-mutants]
    timeout-minutes: 60
    # Read-only scopes; nothing is uploaded (upload: never), so the job
    # never writes (SEC-SUP-012).
    permissions:
      contents: read # check out the tree to analyse
      actions: read # fingerprinting the local SARIF reads this workflow run
      security-events: read # CodeQL reads its feature flags from code scanning
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every language needs Rust: the Rust extractor, and the xtask check
      # that reads the SARIF.
      - uses: https://github.com/dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: https://github.com/github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: https://github.com/github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          output: codeql-results
          upload: never
          upload-database: false
      # `analyze` does not fail the job on findings when upload is `never`,
      # so xtask reads every SARIF log it wrote (SEC-SUP-018).
      - name: Fail on high-severity or error-level results
        run: |
          set -eu
          found=0
          for sarif in codeql-results/*.sarif; do
            [ -f "$sarif" ] || continue
            found=1
            cargo run --locked --quiet -p xtask -- repo codeql "$sarif"
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::CodeQL wrote no SARIF log"
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: warn
          retention-days: 30

  codeql:
    name: codeql
    needs: analyze
    if: always()
    runs-on: [self-hosted, gunmetal-mutants]
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every language passed
        env:
          RESULT: ${{ needs.analyze.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::CodeQL analysis result: $RESULT"
            exit 1
          fi
