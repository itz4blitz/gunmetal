name: CodeQL

# CodeQL for GitHub Actions and Rust on every pull request, every push to
# main, and weekly (SEC-SUP-014, SEC-SUP-018). JavaScript joins the matrix
# when the tree has any, because CodeQL fails a language with no source.
# The repository is private and GitHub Code Security is off, so the SARIF
# is written locally and not uploaded (`upload: never`).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

# Nothing by default; each job asks for what it needs (SEC-SUP-012).
permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        run: |
          set -eu
          rust='{"language":"rust","build-mode":"autobuild"}'
          actions='{"language":"actions","build-mode":"none"}'
          if git ls-files -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' 'package.json' | grep -q .; then
            javascript='{"language":"javascript-typescript","build-mode":"none"}'
            echo "matrix={\"include\":[${actions},${javascript},${rust}]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[${actions},${rust}]}" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: languages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          output: codeql-results
          upload: never
          upload-database: false
      # `analyze` does not fail the job on findings when upload is `never` (SEC-SUP-018).
      - run: cargo run --locked --quiet -p xtask -- repo codeql codeql-results
