name: Docs

# Docs lints on every pull request and every push to main or a wave branch
# (SEC-TM-001, SEC-TM-072 to SEC-TM-075, SEC-STD-001, SEC-STD-006).
on:
  pull_request:
  push:
    branches: [main, "wave-*"]

# Nothing by default; each job asks for what it needs (SEC-SUP-012).
permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, gunmetal-mutants]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      # Caching is for this CI only; release workflows must not restore or save
      # caches (SEC-SUP-015).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: docs
          add-job-id-key: false
          cache-workspace-crates: true
      - run: cargo run --locked --quiet -p xtask -- docs-lint
