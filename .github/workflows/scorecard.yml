name: Scorecard

# OpenSSF Scorecard, weekly and on every push to main (SEC-SUP-019). The
# results are kept as a workflow artifact. xtask repo scorecard fails the
# job when a required check is below its threshold.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

# Nothing by default; the job asks for what it needs (SEC-SUP-012).
permissions: {}

jobs:
  analysis:
    runs-on: [self-hosted, gunmetal-mutants]
    timeout-minutes: 25
    # Read access Scorecard needs on a private repository. Publishing would
    # also need id-token: write, and code scanning upload security-events:
    # write; neither is used while the repository is private (see below).
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.json
          results_format: json
          # The repository is private. Scorecard publishes results only for
          # public repositories, and the action switches publishing off for
          # a private one anyway. When the repository goes public, set this
          # to true and grant id-token: write to this job.
          publish_results: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      # Caching is for this CI only; release workflows must not restore or save
      # caches (SEC-SUP-015).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: scorecard
          add-job-id-key: false
          cache-workspace-crates: true
      - run: cargo run --locked --quiet -p xtask -- repo scorecard results.json
      # Kept even when a check is under its threshold, so the scores that
      # failed can be read.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.json
          retention-days: 30
