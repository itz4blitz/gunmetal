name: Scorecard

# OpenSSF Scorecard, weekly and on every push to main (SEC-SUP-019). The
# results are kept as a workflow artifact. Failing CI on low scores needs
# the threshold check that SEC-SUP-019 describes, which is not written yet.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

# Nothing by default; the job asks for what it needs (SEC-SUP-012).
permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read access Scorecard needs on a private repository. Publishing would
    # also need id-token: write, and code scanning upload security-events:
    # write; neither is used while the repository is private (see below).
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # The repository is private. Scorecard publishes results only for
          # public repositories, and the action switches publishing off for
          # a private one anyway. When the repository goes public, set this
          # to true and grant id-token: write to this job.
          publish_results: false
      # Code scanning needs GitHub Code Security on a private repository,
      # and it is off, so the SARIF file is kept as an artifact instead.
      # When the repository is public or Code Security is on, upload it with
      # github/codeql-action/upload-sarif and grant security-events: write.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
