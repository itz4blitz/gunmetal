name: Dependency age

# A pull request must not add or change a crate version published less
# than seven days earlier (SEC-SUP-027). The check is `xtask lockfile-age`,
# under the gate like all code; this file only feeds it. The xtask makes
# no network request: it prints the crates.io records to fetch, curl saves
# them, and the xtask checks the saved records. Both lock files count,
# because the fuzz project's dependencies run in CI too.
#
# For an urgent security fix, a maintainer applies the
# `dependency-age-override` label, which skips the job; the code-owner
# review that every Cargo.lock change needs (SEC-SUP-005) is the approval.
# Removing the label runs the check again.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - Cargo.lock
      - fuzz/Cargo.lock
      - .github/workflows/dependency-age.yml

# Nothing by default; the job asks for what it needs (SEC-SUP-012).
permissions: {}

concurrency:
  group: dependency-age-${{ github.ref }}
  cancel-in-progress: true

jobs:
  age:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'dependency-age-override') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      # The full history, so that the base commit's lock files are present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - name: Take the lock files from the base commit
        run: |
          mkdir -p target/dependency-age
          git show "$BASE_SHA:Cargo.lock" > target/dependency-age/base.lock
          git show "$BASE_SHA:fuzz/Cargo.lock" > target/dependency-age/fuzz-base.lock
      # crates.io asks API clients for a user agent and at most one request
      # a second. A version crates.io does not know fails the fetch.
      - name: Fetch the crates.io record of every added version
        run: |
          cargo run --locked --quiet -p xtask -- lockfile-age requests \
            target/dependency-age/base.lock Cargo.lock > target/dependency-age/requests
          cargo run --locked --quiet -p xtask -- lockfile-age requests \
            target/dependency-age/fuzz-base.lock fuzz/Cargo.lock >> target/dependency-age/requests
          if [ -s target/dependency-age/requests ]; then
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --retry 3 --rate 1/s \
              --user-agent 'gunmetal-ci (https://github.com/PremierStudio/gunmetal)' \
              --create-dirs --output-dir target/dependency-age/records \
              --config target/dependency-age/requests
          fi
      - name: Check that each is at least seven days old
        run: |
          cargo run --locked --quiet -p xtask -- lockfile-age check \
            target/dependency-age/base.lock Cargo.lock target/dependency-age/records
          cargo run --locked --quiet -p xtask -- lockfile-age check \
            target/dependency-age/fuzz-base.lock fuzz/Cargo.lock target/dependency-age/records
