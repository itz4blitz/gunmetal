name: CI

# Runs on pull requests from branches and forks with a read-only token and no
# secrets. Never use pull_request_target or workflow_run here (SEC-SUP-013).
#
# The `checks` job runs scripts/gate.sh with mutation testing skipped.
# Decision D-98: CI does not run mutation testing. A full pass held the
# four runners for about a day and blocked every merge. The job named
# `gate` is the one required check, and it fails unless every other job
# succeeded.
on:
  push:
    branches: [main, "wave-*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

# Nothing by default; each job asks for what it needs (SEC-SUP-012).
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every step of scripts/gate.sh except mutation testing.
  checks:
    runs-on: [self-hosted, gunmetal-mutants]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # Every action is pinned to a full commit SHA (SEC-SUP-010).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The exact toolchain from rust-toolchain.toml (SEC-SUP-038). rustup
      # also reads that file, so it wins if the two ever disagree.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, llvm-tools-preview
      # Caching is for this CI only: release workflows must never restore or
      # save caches (SEC-SUP-015).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: checks
          add-job-id-key: false
          cache-workspace-crates: true
          cache-on-failure: true
      # Exact tool versions, downloaded with SHA-256 verification; no fallback
      # to unverified installers (SEC-SUP-011).
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-deny@0.20.2
          fallback: none
      # cargo-vet publishes no prebuilt binaries after 0.10.0, so build the
      # exact version from crates.io; cargo checks each crate's checksum
      # against the index, and --locked uses cargo-vet's own lockfile.
      - run: cargo install cargo-vet --version 0.10.2 --locked
      - run: scripts/gate.sh
        env:
          GATE_SKIP_MUTANTS: 1

  # SEC-MED-004: the core's tests, property tests included, on a target where
  # usize is 32 bits wide, so a length that only fits in 64 bits is caught.
  core-32-bit:
    runs-on: [self-hosted, gunmetal-mutants]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: core-i686
          add-job-id-key: false
          cache-workspace-crates: true
      - run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends gcc-multilib
          else
            apt-get update
            apt-get install --yes --no-install-recommends gcc-multilib
          fi
      - run: cargo test --locked -p gunmetal-core --target i686-unknown-linux-gnu

  # SEC-SUP-020: proves the gate refuses a manifest that Cargo.lock does not
  # match, by adding a crate without updating the lock file.
  locked-self-test:
    runs-on: [self-hosted, gunmetal-mutants]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: checks
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false
      - name: The gate fails on a manifest the lock file does not match
        run: |
          mkdir -p crates/locked-self-test/src
          printf '[package]\nname = "locked-self-test"\nversion = "0.0.0"\nedition = "2024"\n' > crates/locked-self-test/Cargo.toml
          printf '//! Added without a Cargo.lock update.\n' > crates/locked-self-test/src/lib.rs
          if scripts/gate.sh > gate.log 2>&1; then
            cat gate.log
            echo "::error::the gate passed although Cargo.lock does not match the manifests"
            exit 1
          fi
          cat gate.log
          grep -F "because --locked was passed to prevent this" gate.log

  # The gate's switches refuse a value they cannot read and any combination,
  # before anything runs, so no mistyped job passes by testing nothing.
  gate-switches-self-test:
    runs-on: [self-hosted, gunmetal-mutants]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The gate refuses unreadable and combined switches
        run: |
          refused() {
            status=0
            env "$@" scripts/gate.sh > gate.log 2>&1 || status=$?
            cat gate.log
            if ((status != 2)) || [[ "$(wc -l < gate.log)" != 1 ]] || ! grep -q '^gate: GATE_' gate.log; then
              echo "::error::the gate did not refuse $*"
              exit 1
            fi
          }
          refused GATE_SKIP_MUTANTS=yes
          refused GATE_MUTANTS_SHARD=3
          refused GATE_MUTANTS_SHARD=a/b
          refused GATE_MUTANTS_SHARD=01/10
          refused GATE_MUTANTS_SHARD=1/0
          refused GATE_MUTANTS_SHARD=10/10
          refused GATE_MUTANTS_SHARD=0/10000
          refused GATE_MUTANTS_SHARD=0/10 GATE_SKIP_MUTANTS=1
          refused GATE_MUTANTS_DIFF=origin/main GATE_SKIP_MUTANTS=1
          refused GATE_MUTANTS_WARM=yes
          refused GATE_MUTANTS_WARM=1 GATE_SKIP_MUTANTS=1
          refused GATE_MUTANTS_WARM=1 GATE_MUTANTS_SHARD=0/10
          refused GATE_MUTANTS_WARM=1 GATE_MUTANTS_DIFF=origin/main

  # The one check main's ruleset requires. It waits for every other job and
  # runs even when one failed or was cancelled, because a skipped required
  # check counts as passed. Every job must have succeeded.
  gate:
    if: ${{ always() }}
    needs: [checks, core-32-bit, locked-self-test, gate-switches-self-test]
    runs-on: [self-hosted, gunmetal-mutants]
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          wrong=$(jq -r '[to_entries[] | select(.value.result != "success") | "\(.key) ended as \(.value.result)"] | join(", ")' <<<"$NEEDS")
          if [[ -n "$wrong" ]]; then
            echo "::error::the gate fails: $wrong"
            exit 1
          fi
