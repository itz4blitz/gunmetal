# SEC-SUP-026: only reviewed crates may run a build script, no dependency may
# ship a native executable or an executable script, and the workspace has no
# build script of its own (the gate checks that). A crate joins the list in
# the same step as its root Cargo.toml line and its cargo-vet entry.
[bans.build]
executables = "deny"
interpreted = "deny"
include-dependencies = true
include-workspace = true
include-archives = true
allow-build-scripts = [
    "getrandom",
    "libc",
    "num-traits",
    "rustix",
    "zerocopy",
]

# Reviewed 2026-10-03, for this version only: zerocopy's build script runs
# nothing but `rustc --version`. The shell scripts it ships are its own CI
# tools, which nothing in the build runs.
[[bans.build.bypass]]
crate = "zerocopy@0.8.59"
allow-globs = ["cargo.sh", "ci/*.sh"]

# SEC-STD-022: rand's small_rng feature is a non-cryptographic generator.
[[bans.features]]
crate = "rand"
deny = ["small_rng"]
reason = "SmallRng is a non-cryptographic generator (SEC-STD-022)"

# SEC-SUP-021: crates.io is the only allowed source. No git dependencies and
# no other registries.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
