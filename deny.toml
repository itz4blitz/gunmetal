    # script interpreter, until the plugin requirements are met.
    { crate = "libloading", reason = "dynamic library loading (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "dlopen", reason = "dynamic library loading (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "dlopen2", reason = "dynamic library loading (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "sharedlib", reason = "dynamic library loading (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "abi_stable", reason = "dynamic library loading (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "wasmtime", reason = "WebAssembly runtime (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "wasmer", reason = "WebAssembly runtime (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "wasmi", reason = "WebAssembly runtime (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "wasm3", reason = "WebAssembly runtime (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "extism", reason = "WebAssembly plugin runtime (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "mlua", reason = "Lua interpreter (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "rlua", reason = "Lua interpreter (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "pyo3", reason = "Python interpreter (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "deno_core", reason = "JavaScript runtime (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "deno_runtime", reason = "JavaScript runtime (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "v8", reason = "JavaScript engine (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "rquickjs", reason = "JavaScript engine (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "boa_engine", reason = "JavaScript engine (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "rhai", reason = "script interpreter (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "rune", reason = "script interpreter (SEC-EXT-018, SEC-HIS-056)" },
    { crate = "gluon", reason = "script interpreter (SEC-EXT-018, SEC-HIS-056)" },

    # SEC-TM-038, SEC-HIS-034: R1 parses no XML. A later release admits one
