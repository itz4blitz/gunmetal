[workspace]
resolver = "3"
members = ["crates/*"]
# The cargo-fuzz project needs a nightly toolchain and libFuzzer, so it is a
# workspace of its own; its harnesses live in crates/gunmetal-fuzz.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/PremierStudio/gunmetal"
homepage = "https://gunmetal.tv"

[workspace.dependencies]
proptest = "1"
# Only in gunmetal-core/src/crypto.rs and gunmetal-secrets/src/crypto/ (SEC-STD-018).
sha2 = { version = "0.11", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Async code must not hold a lock across an await (SEC-STD-029).
await_holding_lock = "deny"
# The APIs listed in clippy.toml are errors even without -D warnings
# (SEC-MED-063, SEC-EXT-001, SEC-STD-022, SEC-TM-031).
disallowed_methods = "deny"
disallowed_types = "deny"

# Integer overflow panics in release builds too, instead of wrapping
# silently (SEC-STD-033).
[profile.release]
overflow-checks = true
