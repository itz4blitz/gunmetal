[package]
name = "gunmetal-server"
description = "The Gunmetal server: the gunmetal binary, its command line, configuration, logger and application state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "gunmetal"
path = "src/main.rs"

[dependencies]
axum.workspace = true
gunmetal-core = { path = "../gunmetal-core", version = "0.0.0" }
gunmetal-durable = { path = "../gunmetal-durable", version = "0.0.0" }
gunmetal-fs = { path = "../gunmetal-fs", version = "0.0.0" }
gunmetal-http = { path = "../gunmetal-http", version = "0.0.0" }
gunmetal-secrets = { path = "../gunmetal-secrets", version = "0.0.0" }
gunmetal-store = { path = "../gunmetal-store", version = "0.0.0" }
rustix = { workspace = true, features = ["process", "std", "thread"] }
toml = { workspace = true, features = ["parse"] }

[dev-dependencies]
axum.workspace = true
gunmetal-secrets = { path = "../gunmetal-secrets", version = "0.0.0" }
gunmetal-testkit.workspace = true
proptest.workspace = true

[lints]
workspace = true
