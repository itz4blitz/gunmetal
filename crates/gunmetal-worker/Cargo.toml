[package]
name = "gunmetal-worker"
description = "Gunmetal's worker process: the sandbox launcher and the worker's confinement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
close_fds = "0.3.2"
landlock.workspace = true
rustix = { workspace = true, features = ["fs", "process", "std", "thread"] }
seccompiler.workspace = true

[dev-dependencies]
rustix = { workspace = true, features = ["process", "std"] }

# The hostile test worker is this test's own executable, started again by
# the launcher, so the test needs its own `main` to enter the worker path.
[[test]]
name = "sandbox"
harness = false

[lints]
workspace = true
