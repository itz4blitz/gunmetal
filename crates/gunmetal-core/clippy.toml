    { path = "rustls::client::danger::DangerousClientConfig", reason = "certificate verification is never switched off (SEC-HIS-026)" },
]

# SEC-MED-002 covers non-test code. These let tests unwrap, expect, panic and
# index, which is how a test fails; the lints stay denied everywhere else.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
