# Clippy's configuration for gunmetal-core.
#
# Clippy reads the clippy.toml nearest to each crate, so for the core this
# file replaces the workspace's. From its first list on it is
# ../../clippy.toml word for word, with the core's own rules added at the end
# of the methods list and at the end of the file. The core's tests fail if a
# workspace rule is missing here (tests/workspace_rules.rs), and the gate
# refuses any other clippy.toml. Change both files together.

