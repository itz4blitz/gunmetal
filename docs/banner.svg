<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Gunmetal: play the original">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14171b"/>
      <stop offset="0.55" stop-color="#232930"/>
      <stop offset="1" stop-color="#2f3740"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5f8"/>
      <stop offset="1" stop-color="#9aa7b4"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c35f"/>
      <stop offset="1" stop-color="#d98f2b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="17.5" fill="none" stroke="#3d4650"/>

  <!-- A play triangle drawn as level-meter bars. -->
  <g fill="url(#brass)">
    <rect x="96" y="92" width="14" height="136" rx="7"/>
    <rect x="120" y="103" width="14" height="114" rx="7"/>
    <rect x="144" y="114" width="14" height="92" rx="7"/>
    <rect x="168" y="125" width="14" height="70" rx="7"/>
    <rect x="192" y="136" width="14" height="48" rx="7"/>
    <rect x="216" y="147" width="14" height="26" rx="7"/>
  </g>

  <text x="286" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="10" fill="url(#steel)">GUNMETAL</text>
  <text x="290" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="500" letter-spacing="1.5" fill="#9aa7b4">Music, movies and TV from your own server. Play the original.</text>
</svg>
